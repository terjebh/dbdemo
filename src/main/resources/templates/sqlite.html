<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{head :: head}"></div>
    <style>
        body { background: #f5f7ff; }
        .sqlite-kort { max-width: 700px; margin: 2rem auto; }
        .kort-head { background: #212529; color: #fff; border-radius: 10px 10px 0 0; padding: 1rem 1.5rem; }
        .kort-body { background: #fff; border: 1px solid #dee2e6; border-top: none; border-radius: 0 0 10px 10px; padding: 1.5rem; }
    </style>
</head>
<body>
<div th:replace="~{meny :: meny}"></div>
<main>
    <div class="sqlite-kort">
        <div class="kort-head">
            <h4 class="mb-0">🗄️ SQLite — mine databaser</h4>
        </div>
        <div class="kort-body">
            <p class="text-muted">
                Her kan du opprette dine egne SQLite-databaser med valgfritt navn.
                Databasene er bare synlige for deg, og du kan kjøre all SQL mot dem.
            </p>

            <div th:if="${feil}" class="alert alert-danger" th:text="${feil}"></div>

            <!-- Opprett ny database -->
            <h5>Opprett ny database</h5>
            <form method="post" th:action="@{/sqlite/opprett}" class="row g-2 mb-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-8">
                    <input type="text" class="form-control" name="navn" placeholder="Databasenavn (f.eks. mittkurs)"
                           required maxlength="60" pattern="[a-zA-Z0-9æøåÆØÅ_-]+">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary w-100">➕ Opprett</button>
                </div>
            </form>

            <!-- Liste over brukerens databaser -->
            <h5>Mine databaser</h5>
            <p th:if="${databaser.isEmpty()}" class="text-muted">Ingen databaser ennå — opprett din første over her!</p>
            <div class="list-group" th:unless="${databaser.isEmpty()}">
                <a th:each="db : ${databaser}" th:href="@{/sqlite/{navn}(navn=${db})}"
                   class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    <span>🗄️ <span th:text="${db}"></span></span>
                    <span class="badge bg-primary rounded-pill">Åpne →</span>
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
