<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{head :: head}"></div>
    <style>
        body { background: var(--app-bg); }
        .sqlite-kort { max-width: 700px; margin: 2rem auto; }
        .kort-head { background: var(--app-aktiv); color: var(--app-aktiv-tekst); border-radius: 10px 10px 0 0; padding: 1rem 1.5rem; }
        .kort-body { background: var(--app-flate); color: var(--app-tekst); border: 1px solid var(--app-kant); border-top: none; border-radius: 0 0 10px 10px; padding: 1.5rem; }
        .kort-body h5 { color: var(--app-tekst); }
        /* Listegruppe følger temaet */
        .list-group-item {
            background-color: var(--app-flate);
            color: var(--app-tekst);
            border-color: var(--app-kant);
        }
        .list-group-item:hover {
            background-color: var(--app-hover);
            color: var(--app-tekst);
        }
    </style>
</head>
<body>
<div th:replace="~{meny :: meny}"></div>
<main>
    <div class="sqlite-kort">
        <div class="kort-head">
            <h4 class="mb-0" th:text="#{sqlite.tittel}">🗄️ SQLite — mine databaser</h4>
        </div>
        <div class="kort-body">
            <p class="text-muted" th:text="#{sqlite.leder}">
                Her kan du opprette dine egne SQLite-databaser med valgfritt navn.
                Databasene er bare synlige for deg, og du kan kjøre all SQL mot dem.
            </p>

            <div th:if="${feil}" class="alert alert-danger" th:text="${feil}"></div>

            <!-- Opprett ny database -->
            <h5 th:text="#{sqlite.opprett}">Opprett ny database</h5>
            <form method="post" th:action="@{/sqlite/opprett}" class="row g-2 mb-4">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="col-md-8">
                    <input type="text" class="form-control" name="navn" th:placeholder="#{sqlite.navn}"
                           required maxlength="60" pattern="[a-zA-Z0-9æøåÆØÅ_-]+">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary w-100" th:text="#{sqlite.opprettKnapp}">➕ Opprett</button>
                </div>
            </form>

            <!-- Liste over brukerens databaser -->
            <h5 th:text="#{sqlite.mine}">Mine databaser</h5>
            <p th:if="${databaser.isEmpty()}" class="text-muted" th:text="#{sqlite.ingen}">Ingen databaser ennå — opprett din første over her!</p>
            <div class="list-group" th:unless="${databaser.isEmpty()}">
                <div th:each="db : ${databaser}" class="list-group-item d-flex justify-content-between align-items-center">
                    <a th:href="@{/sqlite/{navn}(navn=${db})}" class="text-decoration-none d-flex align-items-center gap-2">
                        <span>🗄️ <span th:text="${db}"></span></span>
                    </a>
                    <span class="d-flex align-items-center gap-2">
                        <a th:href="@{/sqlite/{navn}/last-ned(navn=${db})}" class="btn btn-sm btn-outline-secondary"
                           th:title="#{sqlite.lastNed.tittel}" th:text="#{sqlite.lastNed}">⬇️ Last ned</a>
                        <form th:action="@{/sqlite/{navn}/slett(navn=${db})}" method="post" class="m-0"
                              onsubmit="return confirm('⚠️ Slett databasen «' + this.dataset.navn + '»? Dette kan ikke angres!')"
                              data-navn="${db}">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    th:title="#{sqlite.slett.tittel}" th:text="#{sqlite.slett}">🗑️ Slett</button>
                        </form>
                        <a th:href="@{/sqlite/{navn}(navn=${db})}" class="badge bg-primary rounded-pill text-decoration-none"
                           th:text="#{sqlite.apne}">Åpne →</a>
                    </span>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
