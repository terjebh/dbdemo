<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{head :: head}"></div>
    <style>
        body { background: var(--app-bg); }
        .setup-kort { max-width: 1000px; margin: 1rem auto; }
        .db-seksjon { border: 1px solid var(--app-kant); border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem; background: var(--app-flate); }
        .db-seksjon h5 { display: flex; align-items: center; gap: .5rem; color: var(--app-tekst); }
        .db-seksjon .form-check-input:checked { background-color: #0d6efd; border-color: #0d6efd; }
        .db-seksjon.deaktivert { opacity: .55; }
        .test-resultat { font-size: .85rem; margin-top: .5rem; }
        .test-resultat.ok { color: #198754; }
        .test-resultat.feil { color: #dc3545; }
        .kort-head { background: var(--app-aktiv); color: var(--app-aktiv-tekst); border-radius: 10px 10px 0 0; padding: .9rem 1.25rem; }
        .kort-head h4 { color: var(--app-aktiv-tekst); }
        .kort-body { background: var(--app-flate); color: var(--app-tekst); border: 1px solid var(--app-kant); border-top: none; border-radius: 0 0 10px 10px; padding: 1.5rem; }
        .kort-body p.text-muted { color: var(--app-muted); }
        /* Lagre-knappen skal ligge utenfor seksjonene (nederst i høyre kolonne) */
        .sett-innhold { flex: 1; min-width: 0; }
        .sett-innhold .db-seksjon { display: none; }
        .sett-innhold .db-seksjon.synlig { display: block; }
        /* Popup (first-run): innholdet i en modal */
        .veiviser-modal .modal-dialog { max-width: 900px; }
        .veiviser-modal .modal-content { border-radius: 12px; }
        .veiviser-bakgrunn { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<!-- Popup-innhold (first-run): vises i modal når appen ikke er konfigurert -->
<div th:if="${!alleredeKonfigurert}" class="veiviser-bakgrunn">
    <div class="setup-kort">
        <div th:replace="~{setup-innhold :: innhold}"></div>
    </div>
</div>

<!-- Vanlig side (redigeringsmodus): vises når appen er konfigurert -->
<div th:if="${alleredeKonfigurert}">
    <div th:replace="~{meny :: meny}"></div>
    <main>
        <div class="setup-kort">
            <div th:replace="~{setup-innhold :: innhold}"></div>
        </div>
    </main>
</div>



<!-- First-run: åpne skjemaet som popup (modal) -->
<div th:if="${!alleredeKonfigurert}" class="modal fade veiviser-modal" id="veiviserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content" id="veiviserInnhold"></div>
    </div>
</div>

<script th:if="${!alleredeKonfigurert}">
    // Flytt skjemaet inn i modalen og åpne den som popup
    document.addEventListener("DOMContentLoaded", () => {
        const kort = document.querySelector(".setup-kort");
        const innhold = document.getElementById("veiviserInnhold");
        if (kort && innhold) {
            innhold.appendChild(kort);
            const modal = new bootstrap.Modal(document.getElementById("veiviserModal"), { backdrop: "static", keyboard: false });
            modal.show();
        }
        settOppTilkoblingsSide();
    });
</script>

<script th:if="${alleredeKonfigurert}">
    // Merk: MÅ wrappes i arrow-funksjon — å sende settOppTilkoblingsSide
    // direkte evaluerer referansen her, men funksjonen deklareres i et
    // senere script-element (hoisting virker kun innenfor samme script).
    document.addEventListener("DOMContentLoaded", () => settOppTilkoblingsSide());
</script>

<script>
    // 2-spaltet oppførsel: venstremeny viser/skjuler seksjoner + test-knapper
    function settOppTilkoblingsSide() {
        // Venstremeny: klikk på RDBMS-navn → vis riktig seksjon
        document.querySelectorAll(".sett-meny-knapp").forEach((knapp) => {
            knapp.addEventListener("click", () => {
                document.querySelectorAll(".sett-meny-knapp").forEach((k) => k.classList.remove("aktiv"));
                knapp.classList.add("aktiv");
                document.querySelectorAll(".sett-innhold .db-seksjon").forEach((s) => s.classList.remove("synlig"));
                const seksjon = document.getElementById(knapp.dataset.seksjon);
                if (seksjon) seksjon.classList.add("synlig");
            });
        });

        // Deaktiver/aktiver felter basert på checkbox
        document.querySelectorAll(".db-seksjon").forEach((seksjon) => {
            const cb = seksjon.querySelector('input[type=checkbox]');
            if (!cb) return;
            const felter = seksjon.querySelector(".db-felter");
            const oppdater = () => seksjon.classList.toggle("deaktivert", !cb.checked);
            cb.addEventListener("change", oppdater);
            oppdater();
        });

        // Test tilkobling (AJAX)
        document.querySelectorAll(".test-knapp").forEach((knapp) => {
            knapp.addEventListener("click", async () => {
                const rdbms = knapp.dataset.rdbms;
                const seksjon = document.getElementById("seksjon-" + rdbms);
                const resultat = document.getElementById("resultat-" + rdbms);
                const hent = (navn) => seksjon.querySelector('[name="' + navn + '_' + rdbms + '"]').value.trim();
                const payload = {
                    rdbms: rdbms,
                    host: hent("host"),
                    port: parseInt(hent("port")) || 0,
                    database: hent("database"),
                    username: hent("username"),
                    password: seksjon.querySelector('[name="password_' + rdbms + '"]').value
                };
                if (!payload.host || !payload.username) {
                    resultat.className = "test-resultat feil";
                    resultat.textContent = knapp.dataset.mangler || "Fyll inn host og bruker først.";
                    return;
                }
                // Tomt passord er OK i redigeringsmodus: serveren bruker det lagrede
                resultat.className = "test-resultat";
                resultat.textContent = knapp.dataset.pagar || "⏳ Tester tilkobling...";
                try {
                    const resp = await fetch("/setup/test", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "X-CSRF-TOKEN": document.querySelector('input[name="_csrf"]').value
                        },
                        body: JSON.stringify(payload)
                    });
                    const data = await resp.json();
                    resultat.className = "test-resultat " + (data.ok ? "ok" : "feil");
                    resultat.textContent = (data.ok ? "✅ " : "❌ ") + data.melding;
                } catch (e) {
                    resultat.className = "test-resultat feil";
                    resultat.textContent = "❌ Kunne ikke teste tilkoblingen: " + e;
                }
            });
        });
    }
</script>
</body>
</html>
