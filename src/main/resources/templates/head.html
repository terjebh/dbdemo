<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="no" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DB-app</title>
    <!-- Tema settes FØR CSS-en lastes → ingen lys-blits ved sidebytte.
         Select.js overskriver senere om nødvendig. -->
    <script>
      (function () {
        try {
          var skin = localStorage.getItem("skin");
          document.documentElement.dataset.tema = skin === "light" ? "lys" : "mork";
        } catch (e) {
          document.documentElement.dataset.tema = "mork";
        }
      })();
    </script>
    <!-- Bootstrap lastes med defer — blokkerer ikke siden -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/styles.css"/>
    <!-- i18n: språkvelger Norsk/Engelsk (lastes tidlig, brukes av meny og editor) -->
    <script src="/i18n.js" defer></script>
    <!-- sql-formatter (kun nødvendig for formatering) lastes async -->
    <script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.4.2/dist/sql-formatter.min.js" async></script>
</div>
