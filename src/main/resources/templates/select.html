<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="no" xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:replace="~{head :: head}"></div>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@codemirror/theme-one-dark@6.1.2/dist/one-dark.min.css"/>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.8/css/jquery.dataTables.min.css"/>
    <!-- xterm.js: terminal-emulator (defer — aldri synkront i head) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"/>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js" defer></script>
    <script type="importmap">
    {
      "imports": {
        "@codemirror/view": "/vendor/@codemirror/view/dist/index.js",
        "@codemirror/state": "/vendor/@codemirror/state/dist/index.js",
        "@codemirror/language": "/vendor/@codemirror/language/dist/index.js",
        "@codemirror/commands": "/vendor/@codemirror/commands/dist/index.js",
        "@codemirror/autocomplete": "/vendor/@codemirror/autocomplete/dist/index.js",
        "@codemirror/search": "/vendor/@codemirror/search/dist/index.js",
        "@codemirror/lang-sql": "/vendor/@codemirror/lang-sql/dist/index.js",
        "@codemirror/theme-one-dark": "/vendor/@codemirror/theme-one-dark/dist/index.js",
        "@lezer/common": "/vendor/@lezer/common/dist/index.js",
        "@lezer/highlight": "/vendor/@lezer/highlight/dist/index.js",
        "@lezer/lr": "/vendor/@lezer/lr/dist/index.js",
        "crelt": "/vendor/crelt/index.js",
        "style-mod": "/vendor/style-mod/src/style-mod.js",
        "w3c-keyname": "/vendor/w3c-keyname/index.js"
      }
    }
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"
            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous" defer></script>
    <script src="https://cdn.datatables.net/1.13.8/js/jquery.dataTables.min.js" defer></script>
    <script src="/select.js" type="module" defer></script>
</head>
<body>
<div th:replace="~{meny :: meny}"></div>
<main>

    <div class="select-layout">

        <!-- Venstrespalte: trestruktur -->
        <aside id="trePanel">
            <div id="treHeader" class="tre-header">
                <span th:text="#{select.databaser}">Databaser</span>
                <select id="systemSelect" class="form-select form-select-sm" th:title="#{select.velgSystem}">
                    <option th:each="sys : ${systemValg}"
                            th:value="${sys.verdi}"
                            th:selected="${rdbms_sti == sys.verdi}"
                            th:text="${sys.navn}"></option>
                </select>
            </div>
            <div id="tre" class="tre"></div>
        </aside>

        <!-- Dra-splitter: juster bredden på venstrespalten -->
        <div id="treSplitter" title="Dra for å justere bredden"></div>

        <!-- Høyre: editor + resultat -->
        <div class="select-hoyre">
            <form id="sql" method="post" action="/select">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="db" id="db" th:value="${db}"/>
                <input type="hidden" id="rdbms_sti" th:value="${rdbms_sti}"/>
                <input type="hidden" id="query" name="query" th:value="${query}"/>
                <!-- Fanelinje: flere SQL-faner (Ctrl+Shift+N ny, Ctrl+Shift+X lukk) -->
                <div class="fane-linje">
                    <div id="faneListe" class="fane-liste" title="SQL-faner — Ctrl+Shift+N: ny fane, Ctrl+Shift+X: lukk fane"></div>
                    <!-- Kjør-knapp (▶) — for nettbrett/berøringsskjermer uten Ctrl-tast -->
                    <button type="button" id="kjorKnapp" class="btn btn-success btn-sm fane-kjor-knapp"
                            th:title="#{select.kjorTittel}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="vertical-align:-2px;">
                            <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>
                        </svg>
                        <span class="d-none d-sm-inline" th:text="#{select.kjor}">Kjør</span>
                    </button>
                    <!-- Terminal-knapp: åpner terminal-emulator med ssh-klient -->
                    <button type="button" id="terminalKnapp" class="btn btn-outline-light btn-sm fane-kjor-knapp"
                            th:title="#{select.terminalTittel}" style="border-color:var(--app-kant); color:var(--app-tekst);">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="vertical-align:-2px;">
                            <path d="M4 1h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2zm7.646 4.646a.5.5 0 0 0-.708-.708L8 7.293 6.062 5.354a.5.5 0 1 0-.708.708L7.293 8l-1.939 1.938a.5.5 0 0 0 .708.708L8 8.707l1.938 1.939a.5.5 0 0 0 .708-.708L8.707 8l1.939-1.938z"/>
                        </svg>
                        <span class="d-none d-sm-inline" th:text="#{select.terminal}">Terminal</span>
                    </button>
                    <!-- Transaksjonsknapper: Commit/Rollback — kun synlige når en
                         transaksjon er åpen i den aktive fanen (JS styrer synlighet) -->
                    <span id="transaksjonInfo" class="badge text-bg-warning fane-tx-info" style="display:none; align-self:center;">
                        ⚡ Transaksjon åpen
                    </span>
                    <button type="button" id="commitKnapp" class="btn btn-success btn-sm fane-kjor-knapp"
                            style="display:none;" th:title="#{select.commitTittel}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" style="vertical-align:-1px;">
                            <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
                        </svg>
                        <span th:text="#{select.commit}">COMMIT</span>
                    </button>
                    <button type="button" id="rollbackKnapp" class="btn btn-danger btn-sm fane-kjor-knapp"
                            style="display:none;" th:title="#{select.rollbackTittel}">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" style="vertical-align:-1px;">
                            <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/>
                        </svg>
                        <span th:text="#{select.rollback}">ROLLBACK</span>
                    </button>
                    <!-- Lagre SQL-fil (Ctrl+S) + åpne SQL-fil (Ctrl+O) -->
                    <button type="button" id="lagreSqlKnapp" class="btn btn-outline-light btn-sm fane-kjor-knapp"
                            th:title="#{select.lagreSqlTittel}" style="border-color:var(--app-kant); color:var(--app-tekst);">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 1a.5.5 0 0 0-.5.5v13a.5.5 0 0 0 .5.5h15a.5.5 0 0 0 .5-.5v-11a.5.5 0 0 0-.5-.5H12V.5a.5.5 0 0 0-.5-.5h-7A.5.5 0 0 0 4 .5V5H.5zM5 1h6v4H5V1zm9 14H2V6h12v9zm-4-5a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"/></svg>
                    </button>
                    <div class="dropdown">
                        <button type="button" id="apneSqlKnapp" class="btn btn-outline-light btn-sm fane-kjor-knapp dropdown-toggle"
                                data-bs-toggle="dropdown" aria-expanded="false"
                                th:title="#{select.apneSqlTittel}" style="border-color:var(--app-kant); color:var(--app-tekst);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M8.5 11.5a.5.5 0 0 1-1 0V5.707L5.354 7.854a.5.5 0 1 1-.708-.708l3-3a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 5.707V11.5z"/><path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z"/></svg>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end" id="sqlFilListe"></ul>
                    </div>
                </div>
                <div id="editorContainer"></div>
            </form>

            <!-- Dra-splitter: juster høyden mellom kode og resultat -->
            <div id="editorSplitter" title="Dra for å justere høyden"></div>

            <!-- Resultatpanel (pgAdmin4-stil).
                 Feilmeldingen vises her (fyller panelet) når SQL-en feiler,
                 resultat-tabellen ellers. -->
            <div id="resultatPanel">
                <div class="resultat-verktøylinje">
                    <div id="resultatStatus" class="text-muted small" th:text="#{select.kjorHint}">Kjør en spørring med ctrl+enter — resultatet vises her</div>
                    <div class="resultat-knapper d-flex align-items-center gap-1">
                        <!-- Lagre resultat-tabellen som CSV-fil -->
                        <button type="button" id="lagreCsvKnapp" class="btn btn-outline-secondary btn-sm"
                                th:title="#{select.csvTittel}" style="line-height:1;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M14 14V4.5L9.5 0H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2zM9.5 3A1.5 1.5 0 0 0 11 4.5h2V14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5v2z"/><path d="M6.646 8.646a.5.5 0 0 1 .708 0L8 9.293l.646-.647a.5.5 0 0 1 .708.708l-.647.646.647.646a.5.5 0 0 1-.708.708L8 10.707l-.646.647a.5.5 0 0 1-.708-.708l.647-.646-.647-.646a.5.5 0 0 1 0-.708z"/></svg>
                        </button>
                    </div>
                </div>
                <div id="feilmelding" class="alert alert-danger">
                    <th:block th:if="${feil}" th:text="${feil}"/>
                    <th:block th:if="${feil}">
                        <br/><a th:href="@{/setup}">Oppdater tilkoblingsinformasjonen →</a>
                    </th:block>
                </div>
                <div id="resultatInnhold" class="table-responsive"></div>
            </div>

            <!-- Terminalpanel: vises i stedet for editor+resultat når
                 Terminal-knappen er aktiv (xterm.js fyller dette). -->
            <div id="terminalPanel" style="display:none;">
                <div class="terminal-verktøylinje">
                    <span class="text-muted small" th:text="#{select.terminalHint}">Lokal shell — koble til med f.eks. ssh bruker@vert</span>
                    <button type="button" id="terminalLukk" class="btn btn-outline-secondary btn-sm"
                            th:text="#{select.terminalLukk}">✕ Lukk terminal</button>
                </div>
                <div id="terminalContainer" style="height: 100%;"></div>
            </div>
        </div>
    </div>

</main>
</body>
</html>
