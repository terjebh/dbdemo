<!DOCTYPE html>
<html th:lang="${#locale.language}" lang="no" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="innhold">
    <div class="kort-head">
        <h4 class="mb-0" th:text="${!alleredeKonfigurert} ? #{setup.velkommen} : (${erAdminBruker} ? #{setup.tittel} : #{setup.mine})">🔧 Innstillinger</h4>
    </div>
    <div class="kort-body">
        <p class="text-muted" th:text="${!alleredeKonfigurert} ? #{setup.leder.forstegang} : (${erAdminBruker} ? #{setup.leder} : #{setup.leder.bruker})">Oppdater tilkoblingsinformasjonen</p>

        <div th:if="${alleredeKonfigurert && !redigeringsmodus}" class="alert alert-info">
            Appen er allerede konfigurert. Gå til <a th:href="@{/login}">innlogging</a>.
        </div>

        <div th:if="${feil}" class="alert alert-danger" th:text="${feil}"></div>

        <form th:if="${!alleredeKonfigurert || redigeringsmodus}" method="post" th:action="@{/setup}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="sett-opp-2kol">
                <!-- Venstremeny: navn på RDBMS-er med status etter navnet -->
                <div class="sett-meny">
                    <button type="button" class="sett-meny-knapp aktiv" data-seksjon="seksjon-admin" th:if="${!alleredeKonfigurert || erAdminBruker}">th:text="#{setup.admin}">🔐 Admin-bruker</button>
                    <button type="button" class="sett-meny-knapp" data-seksjon="seksjon-postgres">th:text="#{setup.postgres}">🐘 PostgreSQL
                        <span th:if="${tilkoblingsstatus['postgres'] == 'OK'}" class="sett-status ok">OK</span>
                        <span th:if="${tilkoblingsstatus['postgres'] != null && tilkoblingsstatus['postgres'] != 'OK'}" class="sett-status feil" th:title="${tilkoblingsstatus['postgres']}">✕</span>
                    </button>
                    <button type="button" class="sett-meny-knapp" data-seksjon="seksjon-mysql">th:text="#{setup.mysql}">🐬 MySQL / MariaDB
                        <span th:if="${tilkoblingsstatus['mysql'] == 'OK'}" class="sett-status ok">OK</span>
                        <span th:if="${tilkoblingsstatus['mysql'] != null && tilkoblingsstatus['mysql'] != 'OK'}" class="sett-status feil" th:title="${tilkoblingsstatus['mysql']}">✕</span>
                    </button>
                    <button type="button" class="sett-meny-knapp" data-seksjon="seksjon-oracle">th:text="#{setup.oracle}">🏛️ Oracle
                        <span th:if="${tilkoblingsstatus['oracle'] == 'OK'}" class="sett-status ok">OK</span>
                        <span th:if="${tilkoblingsstatus['oracle'] != null && tilkoblingsstatus['oracle'] != 'OK'}" class="sett-status feil" th:title="${tilkoblingsstatus['oracle']}">✕</span>
                    </button>
                    <button type="button" class="sett-meny-knapp" data-seksjon="seksjon-microsoft">th:text="#{setup.mssql}">🪟 MS SQL Server
                        <span th:if="${tilkoblingsstatus['microsoft'] == 'OK'}" class="sett-status ok">OK</span>
                        <span th:if="${tilkoblingsstatus['microsoft'] != null && tilkoblingsstatus['microsoft'] != 'OK'}" class="sett-status feil" th:title="${tilkoblingsstatus['microsoft']}">✕</span>
                    </button>
                </div>

                <!-- Høyre: valgt system -->
                <div class="sett-innhold">
                    <!-- Admin-bruker: kun for første-admin (som eier passordet) -->
                    <div class="db-seksjon synlig" id="seksjon-admin" th:if="${!alleredeKonfigurert || erAdminBruker}">
                        <h5 th:text="#{setup.admin}">🔐 Admin-bruker</h5>
                        <div class="row g-3 mt-1">
                            <div class="col-md-6">
                                <label class="form-label" th:text="#{setup.brukernavn}">Brukernavn</label>
                                <input type="text" class="form-control" name="adminUsername"
                                       th:value="${config?.adminUsername}" required autofocus>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" th:text="#{setup.passord}">Passord</label>
                                <input type="password" class="form-control" name="adminPassword"
                                       th:placeholder="${redigeringsmodus} ? #{setup.beholdPassord} : #{setup.sterktPassord}"
                                       th:required="${!redigeringsmodus}">
                            </div>
                        </div>
                    </div>

                    <!-- PostgreSQL -->
                    <div class="db-seksjon" id="seksjon-postgres">
                        <h5>
                            <input class="form-check-input" type="checkbox" id="enabled_postgres" name="enabled_postgres"
                                   th:checked="${mineTilkoblinger?.get('postgres')?.enabled}">
                            <label class="form-check-label" for="enabled_postgres" th:text="#{setup.postgres}">🐘 PostgreSQL</label>
                        </h5>
                        <div class="row g-3 mt-1 db-felter">
                            <div class="col-md-3"><label class="form-label" th:text="#{setup.vert}">Vert (host)</label>
                                <input type="text" class="form-control" name="host_postgres"
                                       th:value="${mineTilkoblinger?.get('postgres')?.host}" placeholder="f.eks. db.eksempel.no"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.port}">Port</label>
                                <input type="number" class="form-control" name="port_postgres"
                                       th:value="${mineTilkoblinger?.get('postgres')?.port}" placeholder="5432"></div>
                            <div class="col-md-3"><label class="form-label" th:text="#{setup.database}">Database</label>
                                <input type="text" class="form-control" name="database_postgres"
                                       th:value="${mineTilkoblinger?.get('postgres')?.database}" placeholder="f.eks. hr"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.bruker}">Bruker</label>
                                <input type="text" class="form-control" name="username_postgres"
                                       th:value="${mineTilkoblinger?.get('postgres')?.username}"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.passord}">Passord</label>
                                <input type="password" class="form-control" name="password_postgres"></div>
                        </div>
                        <button type="button" class="btn btn-outline-success btn-sm mt-2 test-knapp" th:data-mangler="#{setup.test.mangler}" th:data-pagar="#{setup.test.paGår}" data-rdbms="postgres" th:text="#{setup.test}">Test tilkobling</button>
                        <div class="test-resultat" id="resultat-postgres"></div>
                    </div>

                    <!-- MySQL/MariaDB -->
                    <div class="db-seksjon" id="seksjon-mysql">
                        <h5>
                            <input class="form-check-input" type="checkbox" id="enabled_mysql" name="enabled_mysql"
                                   th:checked="${mineTilkoblinger?.get('mysql')?.enabled}">
                            <label class="form-check-label" for="enabled_mysql" th:text="#{setup.mysql}">🐬 MySQL / MariaDB</label>
                        </h5>
                        <div class="row g-3 mt-1 db-felter">
                            <div class="col-md-3"><label class="form-label" th:text="#{setup.vert}">Vert (host)</label>
                                <input type="text" class="form-control" name="host_mysql"
                                       th:value="${mineTilkoblinger?.get('mysql')?.host}" placeholder="f.eks. db.eksempel.no"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.port}">Port</label>
                                <input type="number" class="form-control" name="port_mysql"
                                       th:value="${mineTilkoblinger?.get('mysql')?.port}" placeholder="3306"></div>
                            <div class="col-md-3"><label class="form-label" th:text="#{setup.database}">Database</label>
                                <input type="text" class="form-control" name="database_mysql"
                                       th:value="${mineTilkoblinger?.get('mysql')?.database}" placeholder="f.eks. hr"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.bruker}">Bruker</label>
                                <input type="text" class="form-control" name="username_mysql"
                                       th:value="${mineTilkoblinger?.get('mysql')?.username}"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.passord}">Passord</label>
                                <input type="password" class="form-control" name="password_mysql"></div>
                        </div>
                        <button type="button" class="btn btn-outline-success btn-sm mt-2 test-knapp" th:data-mangler="#{setup.test.mangler}" th:data-pagar="#{setup.test.paGår}" data-rdbms="mysql" th:text="#{setup.test}">Test tilkobling</button>
                        <div class="test-resultat" id="resultat-mysql"></div>
                    </div>

                    <!-- Oracle -->
                    <div class="db-seksjon" id="seksjon-oracle">
                        <h5>
                            <input class="form-check-input" type="checkbox" id="enabled_oracle" name="enabled_oracle"
                                   th:checked="${mineTilkoblinger?.get('oracle')?.enabled}">
                            <label class="form-check-label" for="enabled_oracle" th:text="#{setup.oracle}">🏛️ Oracle</label>
                        </h5>
                        <div class="row g-3 mt-1 db-felter">
                            <div class="col-md-3"><label class="form-label" th:text="#{setup.vert}">Vert (host)</label>
                                <input type="text" class="form-control" name="host_oracle"
                                       th:value="${mineTilkoblinger?.get('oracle')?.host}" placeholder="f.eks. db.eksempel.no"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.port}">Port</label>
                                <input type="number" class="form-control" name="port_oracle"
                                       th:value="${mineTilkoblinger?.get('oracle')?.port}" placeholder="1521"></div>
                            <div class="col-md-3"><label class="form-label" th:text="#{setup.service}">Service / SID</label>
                                <input type="text" class="form-control" name="database_oracle"
                                       th:value="${mineTilkoblinger?.get('oracle')?.database}" placeholder="f.eks. HR"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.bruker}">Bruker</label>
                                <input type="text" class="form-control" name="username_oracle"
                                       th:value="${mineTilkoblinger?.get('oracle')?.username}"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.passord}">Passord</label>
                                <input type="password" class="form-control" name="password_oracle"></div>
                        </div>
                        <button type="button" class="btn btn-outline-success btn-sm mt-2 test-knapp" th:data-mangler="#{setup.test.mangler}" th:data-pagar="#{setup.test.paGår}" data-rdbms="oracle" th:text="#{setup.test}">Test tilkobling</button>
                        <div class="test-resultat" id="resultat-oracle"></div>
                    </div>

                    <!-- MS SQL Server -->
                    <div class="db-seksjon" id="seksjon-microsoft">
                        <h5>
                            <input class="form-check-input" type="checkbox" id="enabled_microsoft" name="enabled_microsoft"
                                   th:checked="${mineTilkoblinger?.get('microsoft')?.enabled}">
                            <label class="form-check-label" for="enabled_microsoft" th:text="#{setup.mssql}">🪟 MS SQL Server</label>
                        </h5>
                        <div class="row g-3 mt-1 db-felter">
                            <div class="col-md-3"><label class="form-label" th:text="#{setup.vert}">Vert (host)</label>
                                <input type="text" class="form-control" name="host_microsoft"
                                       th:value="${mineTilkoblinger?.get('microsoft')?.host}" placeholder="f.eks. db.eksempel.no"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.port}">Port</label>
                                <input type="number" class="form-control" name="port_microsoft"
                                       th:value="${mineTilkoblinger?.get('microsoft')?.port}" placeholder="1433"></div>
                            <div class="col-md-3"><label class="form-label" th:text="#{setup.database}">Database</label>
                                <input type="text" class="form-control" name="database_microsoft"
                                       th:value="${mineTilkoblinger?.get('microsoft')?.database}" placeholder="f.eks. hr"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.bruker}">Bruker</label>
                                <input type="text" class="form-control" name="username_microsoft"
                                       th:value="${mineTilkoblinger?.get('microsoft')?.username}"></div>
                            <div class="col-md-2"><label class="form-label" th:text="#{setup.passord}">Passord</label>
                                <input type="password" class="form-control" name="password_microsoft"></div>
                        </div>
                        <button type="button" class="btn btn-outline-success btn-sm mt-2 test-knapp" th:data-mangler="#{setup.test.mangler}" th:data-pagar="#{setup.test.paGår}" data-rdbms="microsoft" th:text="#{setup.test}">Test tilkobling</button>
                        <div class="test-resultat" id="resultat-microsoft"></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-3"
                            th:text="${!alleredeKonfigurert} ? #{setup.lagre.forstegang} : #{setup.lagre}"></button>
                </div>
            </div>
        </form>
    </div>
</th:block>
</html>
