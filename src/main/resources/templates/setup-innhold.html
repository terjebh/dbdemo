<!DOCTYPE html>
<html lang="no" xmlns:th="http://www.thymeleaf.org">
<th:block th:fragment="innhold">
    <div class="kort-head">
        <h4 class="mb-0" th:text="${redigeringsmodus} ? '🔧 Innstillinger' : '👋 Velkommen til DBApp — første gangs oppsett'"></h4>
    </div>
    <div class="kort-body">
        <p class="text-muted" th:text="${redigeringsmodus} ? 'Oppdater tilkoblingsinformasjonen for databasene. Tomme passordfelt betyr at det eksisterende passordet beholdes.' : 'Fyll inn innloggingsinformasjon for admin-brukeren og de databasene du vil knytte appen til. Du kan velge én eller flere — de du ikke fyller ut, er ikke aktive. Informasjonen lagres i en lokal konfigurasjonsfil utenfor repoet.'"></p>

        <div th:if="${alleredeKonfigurert && !redigeringsmodus}" class="alert alert-info">
            Appen er allerede konfigurert. Gå til <a th:href="@{/login}">innlogging</a>.
        </div>

        <div th:if="${feil}" class="alert alert-danger" th:text="${feil}"></div>

        <!-- Tilkoblingsstatus -->
        <div th:if="${tilkoblingsstatus != null && !tilkoblingsstatus.isEmpty()}" class="mb-3">
            <h6 style="color: var(--app-tekst);">Tilkoblingsstatus</h6>
            <ul class="list-unstyled">
                <li th:each="entry : ${tilkoblingsstatus}">
                    <span th:if="${entry.value == 'OK'}" class="text-success">✅</span>
                    <span th:unless="${entry.value == 'OK'}" class="text-danger">❌</span>
                    <span th:text="${' ' + entry.key + ': ' + entry.value}" style="color: var(--app-tekst);"></span>
                </li>
            </ul>
        </div>

        <form th:if="${!alleredeKonfigurert || redigeringsmodus}" method="post" th:action="@{/setup}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="sett-opp-2kol">
                <!-- Venstremeny: navn på RDBMS-er -->
                <div class="sett-meny">
                    <button type="button" class="sett-meny-knapp aktiv" data-seksjon="seksjon-admin">🔐 Admin-bruker</button>
                    <button type="button" class="sett-meny-knapp" data-seksjon="seksjon-postgres">🐘 PostgreSQL</button>
                    <button type="button" class="sett-meny-knapp" data-seksjon="seksjon-mysql">🐬 MySQL / MariaDB</button>
                    <button type="button" class="sett-meny-knapp" data-seksjon="seksjon-oracle">🏛️ Oracle</button>
                    <button type="button" class="sett-meny-knapp" data-seksjon="seksjon-microsoft">🪟 MS SQL Server</button>
                </div>

                <!-- Høyre: valgt system -->
                <div class="sett-innhold">
                    <!-- Admin-bruker -->
                    <div class="db-seksjon synlig" id="seksjon-admin">
                        <h5>🔐 Admin-bruker</h5>
                        <div class="row g-3 mt-1">
                            <div class="col-md-6">
                                <label class="form-label">Brukernavn</label>
                                <input type="text" class="form-control" name="adminUsername"
                                       th:value="${config?.adminUsername}" required autofocus>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Passord</label>
                                <input type="password" class="form-control" name="adminPassword"
                                       th:placeholder="${redigeringsmodus} ? 'Behold eksisterende (tomt = uendret)' : 'Velg et sterkt passord'"
                                       th:required="${!redigeringsmodus}">
                            </div>
                        </div>
                    </div>

                    <!-- PostgreSQL -->
                    <div class="db-seksjon" id="seksjon-postgres">
                        <h5>
                            <input class="form-check-input" type="checkbox" id="enabled_postgres" name="enabled_postgres"
                                   th:checked="${config?.connections?.get('postgres')?.enabled}">
                            <label class="form-check-label" for="enabled_postgres">🐘 PostgreSQL</label>
                        </h5>
                        <div class="row g-3 mt-1 db-felter">
                            <div class="col-md-3"><label class="form-label">Vert (host)</label>
                                <input type="text" class="form-control" name="host_postgres"
                                       th:value="${config?.connections?.get('postgres')?.host}" placeholder="f.eks. db.eksempel.no"></div>
                            <div class="col-md-2"><label class="form-label">Port</label>
                                <input type="number" class="form-control" name="port_postgres"
                                       th:value="${config?.connections?.get('postgres')?.port}" placeholder="5432"></div>
                            <div class="col-md-3"><label class="form-label">Database</label>
                                <input type="text" class="form-control" name="database_postgres"
                                       th:value="${config?.connections?.get('postgres')?.database}" placeholder="f.eks. hr"></div>
                            <div class="col-md-2"><label class="form-label">Bruker</label>
                                <input type="text" class="form-control" name="username_postgres"
                                       th:value="${config?.connections?.get('postgres')?.username}"></div>
                            <div class="col-md-2"><label class="form-label">Passord</label>
                                <input type="password" class="form-control" name="password_postgres"></div>
                        </div>
                        <button type="button" class="btn btn-outline-success btn-sm mt-2 test-knapp" data-rdbms="postgres">Test tilkobling</button>
                        <div class="test-resultat" id="resultat-postgres"></div>
                    </div>

                    <!-- MySQL/MariaDB -->
                    <div class="db-seksjon" id="seksjon-mysql">
                        <h5>
                            <input class="form-check-input" type="checkbox" id="enabled_mysql" name="enabled_mysql"
                                   th:checked="${config?.connections?.get('mysql')?.enabled}">
                            <label class="form-check-label" for="enabled_mysql">🐬 MySQL / MariaDB</label>
                        </h5>
                        <div class="row g-3 mt-1 db-felter">
                            <div class="col-md-3"><label class="form-label">Vert (host)</label>
                                <input type="text" class="form-control" name="host_mysql"
                                       th:value="${config?.connections?.get('mysql')?.host}" placeholder="f.eks. db.eksempel.no"></div>
                            <div class="col-md-2"><label class="form-label">Port</label>
                                <input type="number" class="form-control" name="port_mysql"
                                       th:value="${config?.connections?.get('mysql')?.port}" placeholder="3306"></div>
                            <div class="col-md-3"><label class="form-label">Database</label>
                                <input type="text" class="form-control" name="database_mysql"
                                       th:value="${config?.connections?.get('mysql')?.database}" placeholder="f.eks. hr"></div>
                            <div class="col-md-2"><label class="form-label">Bruker</label>
                                <input type="text" class="form-control" name="username_mysql"
                                       th:value="${config?.connections?.get('mysql')?.username}"></div>
                            <div class="col-md-2"><label class="form-label">Passord</label>
                                <input type="password" class="form-control" name="password_mysql"></div>
                        </div>
                        <button type="button" class="btn btn-outline-success btn-sm mt-2 test-knapp" data-rdbms="mysql">Test tilkobling</button>
                        <div class="test-resultat" id="resultat-mysql"></div>
                    </div>

                    <!-- Oracle -->
                    <div class="db-seksjon" id="seksjon-oracle">
                        <h5>
                            <input class="form-check-input" type="checkbox" id="enabled_oracle" name="enabled_oracle"
                                   th:checked="${config?.connections?.get('oracle')?.enabled}">
                            <label class="form-check-label" for="enabled_oracle">🏛️ Oracle</label>
                        </h5>
                        <div class="row g-3 mt-1 db-felter">
                            <div class="col-md-3"><label class="form-label">Vert (host)</label>
                                <input type="text" class="form-control" name="host_oracle"
                                       th:value="${config?.connections?.get('oracle')?.host}" placeholder="f.eks. db.eksempel.no"></div>
                            <div class="col-md-2"><label class="form-label">Port</label>
                                <input type="number" class="form-control" name="port_oracle"
                                       th:value="${config?.connections?.get('oracle')?.port}" placeholder="1521"></div>
                            <div class="col-md-3"><label class="form-label">Service / SID</label>
                                <input type="text" class="form-control" name="database_oracle"
                                       th:value="${config?.connections?.get('oracle')?.database}" placeholder="f.eks. HR"></div>
                            <div class="col-md-2"><label class="form-label">Bruker</label>
                                <input type="text" class="form-control" name="username_oracle"
                                       th:value="${config?.connections?.get('oracle')?.username}"></div>
                            <div class="col-md-2"><label class="form-label">Passord</label>
                                <input type="password" class="form-control" name="password_oracle"></div>
                        </div>
                        <button type="button" class="btn btn-outline-success btn-sm mt-2 test-knapp" data-rdbms="oracle">Test tilkobling</button>
                        <div class="test-resultat" id="resultat-oracle"></div>
                    </div>

                    <!-- MS SQL Server -->
                    <div class="db-seksjon" id="seksjon-microsoft">
                        <h5>
                            <input class="form-check-input" type="checkbox" id="enabled_microsoft" name="enabled_microsoft"
                                   th:checked="${config?.connections?.get('microsoft')?.enabled}">
                            <label class="form-check-label" for="enabled_microsoft">🪟 MS SQL Server</label>
                        </h5>
                        <div class="row g-3 mt-1 db-felter">
                            <div class="col-md-3"><label class="form-label">Vert (host)</label>
                                <input type="text" class="form-control" name="host_microsoft"
                                       th:value="${config?.connections?.get('microsoft')?.host}" placeholder="f.eks. db.eksempel.no"></div>
                            <div class="col-md-2"><label class="form-label">Port</label>
                                <input type="number" class="form-control" name="port_microsoft"
                                       th:value="${config?.connections?.get('microsoft')?.port}" placeholder="1433"></div>
                            <div class="col-md-3"><label class="form-label">Database</label>
                                <input type="text" class="form-control" name="database_microsoft"
                                       th:value="${config?.connections?.get('microsoft')?.database}" placeholder="f.eks. hr"></div>
                            <div class="col-md-2"><label class="form-label">Bruker</label>
                                <input type="text" class="form-control" name="username_microsoft"
                                       th:value="${config?.connections?.get('microsoft')?.username}"></div>
                            <div class="col-md-2"><label class="form-label">Passord</label>
                                <input type="password" class="form-control" name="password_microsoft"></div>
                        </div>
                        <button type="button" class="btn btn-outline-success btn-sm mt-2 test-knapp" data-rdbms="microsoft">Test tilkobling</button>
                        <div class="test-resultat" id="resultat-microsoft"></div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100 mt-3"
                            th:text="${redigeringsmodus} ? '💾 Lagre endringer' : '💾 Lagre og fortsett til innlogging'"></button>
                </div>
            </div>
        </form>
    </div>
</th:block>
</html>
