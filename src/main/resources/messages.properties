hjelp.byttFane=Neste / forrige SQL-fane
hjelp.resultat=📊 Resultat-tabellen
hjelp.resultat.tekst=Klikk på en kolonneoverskrift for å sortere. Bruk pil opp/ned i tabellen for å navigere radene (Enter velger raden). Søk og sidevalg ligger øverst i panelet.
hjelp.tre=🧭 Venstrespalten — trestruktur
hjelp.tre.tekst=Venstrespalten viser databasesystemet med databaser, skjemaer (for PostgreSQL), tabeller og views. Klikk på en node for å utvide/skjule. Klikk på en database for å velge den i editoren.
hjelp.toppmeny=🖥️ Toppmenyen
hjelp.toppmeny.tekst=Velg databasesystem og tema (mørk/lys) fra toppmenyen. Resultatet av SQL-kjøringer vises i panelet under editoren — ingen side-reload.
hjelp.sqlite=🗄️ SQLite
hjelp.sqlite.tekst=Alle brukere kan opprette egne SQLite-databaser med valgfritt navn under menyvalget «SQLite». Databasene er private og lagres per bruker.
hjelp.innlogging=⏱️ Innlogging
hjelp.innlogging.tekst=Du forblir innlogget under hele økten (opptil 6 timer) — eller til du logger ut selv.

# ---- Om-siden ----
om.tittel=ℹ️ Om DBApp
om.leder=DBApp er et undervisningsverktøy for å lære SQL — direkte i nettleseren, uten installasjon.
om.hva=Hva er DBApp?
om.hva.tekst=DBApp gir deg et pgAdmin4-lignende grensesnitt med trestruktur, SQL-editor med autocomplete og resultattabell. Du skriver SQL mot ekte databaser og ser resultatet umiddelbart.
om.teknologi=Teknologi
om.teknologi.tekst=Bygget med Java 25, Spring Boot 3.5 og Thymeleaf. Støtter PostgreSQL, MySQL/MariaDB, Oracle, MS SQL Server og SQLite.
om.funksjoner=Funksjoner
om.funksjoner.tekst=SQL-faner, mørkt/lyst tema, norsk/engelsk språk, autocomplete med Tab, tastatursnarveier og per-bruker SQLite-databaser.
om.kode=Kildekode
om.kode.tekst=Prosjektet er åpent — kildekoden ligger på GitHub under MIT-lisens.

