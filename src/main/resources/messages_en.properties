hjelp.nyFane=New SQL tab (same database)
hjelp.lukkFane=Close current SQL tab
hjelp.byttFane=Next / previous SQL tab
hjelp.resultat=📊 Result table
hjelp.resultat.tekst=Click a column header to sort. Use up/down arrows in the table to navigate rows (Enter selects the row). Search and page size are at the top of the panel.
hjelp.tre=🧭 Left panel — tree view
hjelp.searchpath=🔎 Search path (PostgreSQL)
hjelp.searchpath.tekst=Run «SET search_path TO schemaname» once — then you can write just the table name (without schema prefix) in all queries, until you log out or run a new SET search_path (TO DEFAULT to reset).
hjelp.tre.tekst=The left panel shows the database system with databases, schemas (for PostgreSQL), tables and views. Click a node to expand/collapse. Click a database to select it in the editor.
hjelp.toppmeny=🖥️ Top menu
hjelp.toppmeny.tekst=Choose database system and theme (dark/light) from the top menu. SQL results appear in the panel below the editor — no page reload.
hjelp.sqlite=🗄️ SQLite
hjelp.sqlite.tekst=All users can create their own SQLite databases with any name under the “SQLite” menu item. The databases are private and stored per user.
hjelp.innlogging=⏱️ Login
hjelp.innlogging.tekst=You stay logged in for the whole session (up to 6 hours) — or until you log out yourself.

# ---- About page ----
om.tittel=ℹ️ About DBApp
om.leder=DBApp is a teaching tool for learning SQL — right in the browser, no installation needed.
om.hva=What is DBApp?
om.hva.tekst=DBApp gives you a pgAdmin4-like interface with a tree view, SQL editor with autocomplete and a result table. You write SQL against real databases and see the result instantly.
om.teknologi=Technology
om.teknologi.tekst=Built with Java 25, Spring Boot 3.5 and Thymeleaf. Supports PostgreSQL, MySQL/MariaDB, Oracle, MS SQL Server and SQLite.
om.funksjoner=Features
om.funksjoner.tekst=SQL tabs, dark/light theme, Norwegian/English language, Tab autocomplete, keyboard shortcuts and per-user SQLite databases.
om.kode=Source code
om.github=om.github=GitHub repository →
om.kode.tekst=The project is open — source code on GitHub under the MIT license.

