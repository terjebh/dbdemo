# ---- Help modal ----
hjelp.tittel=❓ Help — how to use DBApp
hjelp.lukk=Close
hjelp.snarveier=⌨️ Keyboard shortcuts in the SQL editor
hjelp.tast=Key
hjelp.funksjon=Function
hjelp.kjor=Run the SQL query (result shown below the editor)
hjelp.formater=Format the SQL code (like VS Code)
hjelp.tab=Accept autocomplete suggestion
