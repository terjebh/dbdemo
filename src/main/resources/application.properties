# ===== First-run-oppsett =====
# Konfigurasjonsfil-sti (admin-bruker + DB-tilkoblinger).
# Default: ~/.dbdemo/dbconfig.json  — overstyr med DBDEMO_CONFIG
dbdemo.config.path=${DBDEMO_CONFIG:}

# ===== Query-begrensninger (beskytter serveren mot tunge spørringer) =====
db.query.timeout.seconds=${QUERY_TIMEOUT_SECONDS:15}
db.query.max.rows=${QUERY_MAX_ROWS:10000}
db.readonly=${DB_READONLY:true}

logging.level.root=INFO
server.port=8080
logging.file.name=logs/dbdemo.log

# ===== Sesjon =====
# Brukeren forblir innlogget under forelesninger (opptil 6 timer),
# eller til de logger ut selv.
server.servlet.session.timeout=6h
server.servlet.session.cookie.max-age=6h
