# ===== Innlogging til appen (Spring Security) =====
# Overstyr med miljøvariabler: APP_USER / APP_PASSWORD
spring.security.user.name=${APP_USER:kurs}
spring.security.user.password=${APP_PASSWORD:kurs123}

# ===== Database-servere =====
db.host=${DB_HOST:noderia.com}
db.port.oracle=${DB_PORT_ORACLE:1521}
db.port.mssql=${DB_PORT_MSSQL:1433}
db.oracle.service=${ORACLE_SERVICE:FREE}

# ===== Query-begrensninger (beskytter serveren mot tunge spørringer) =====
db.query.timeout.seconds=${QUERY_TIMEOUT_SECONDS:15}
db.query.max.rows=${QUERY_MAX_ROWS:10000}
db.readonly=${DB_READONLY:true}

# ===== Database-brukere — passord settes via miljøvariabler, aldri i git! =====
pg.username=${PG_USERNAME:}
pg.pwd=${PG_PWD:}
ms.username=${MS_USERNAME:}
ms.pwd=${MS_PWD:}
or.username=${OR_USERNAME:}
or.pwd=${OR_PWD:}
my.username=${MY_USERNAME:}
my.pwd=${MY_PWD:}

logging.level.root=INFO
server.port=8080
logging.file.name=logs/dbdemo.log
